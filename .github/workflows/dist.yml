name: Build distributable

# Button-triggered only (Actions tab -> this workflow -> Run workflow),
# not on every push - each variant runs ~210-580MB (see bundle_java
# below), so building one on every push to every branch would be a lot
# of wasted storage/transfer for something most pushes don't need a
# fresh copy of. One button starts all three jobs below together - they
# have no needs: between them, so GitHub runs them in parallel rather
# than one after another.
on:
  workflow_dispatch:
    inputs:
      bundle_java:
        description: >-
          Bundle a Java runtime (~395MB extra) so it runs with nothing
          else installed. If off, needs Java 17+ already installed (not
          a "headless" JRE - see build-dist.sh for why). Always off for
          macOS regardless of this setting - see build-dist.sh.
        type: boolean
        default: false
      include_input:
        description: >-
          Bundle input/ (~184MB - coordinates, worldmap, earth, moon,
          sun, people, trees) directly instead of leaving it for
          install-assets.sh/.bat (always included either way) to fetch
          afterward - see build-dist.sh for why this is off by default.
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Kept in sync with ci.yml's and image-tests.yml's own pin, so every
  # job below reuses the exact same ~/processing/4.5.2 cache entry those
  # already populate, rather than adding a separate download/cache of it
  # per job on top.
  PROCESSING_VERSION: 4.5.2
  PROCESSING_TAG: processing-1313-4.5.2

jobs:
  # One job per OS below (not one job building all variants, and not a
  # matrix over them either) so a failure building one platform doesn't
  # hold up, or get bundled in with, the others - each is independent,
  # runs in parallel, and uploads its own artifact(s) as soon as it's
  # done. They're genuinely asymmetric besides which variant(s) each
  # builds, which a plain matrix wouldn't fit cleanly: only build-linux
  # can actually *run* its export and smoke-test it end to end; the
  # other two can only check theirs are structurally complete, or not at
  # all - see each job's own steps.

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/${{ env.PROCESSING_VERSION }}
          key: processing-${{ env.PROCESSING_VERSION }}-linux-x64

      - name: Install Processing
        if: steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.zip \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64-portable.zip"
          mkdir -p ~/processing
          unzip -q /tmp/processing.zip -d /tmp/processing-extracted
          mv /tmp/processing-extracted/Processing "$HOME/processing/${PROCESSING_VERSION}"

      - name: Build dist (linux-amd64)
        env:
          NO_JAVA: ${{ inputs.bundle_java && '0' || '1' }}
          INCLUDE_INPUT: ${{ inputs.include_input && '1' || '0' }}
        run: |
          export PROCESSING_HOME="$HOME/processing/${PROCESSING_VERSION}"
          chmod +x build-dist.sh
          ./build-dist.sh linux-amd64

      # install-assets.sh no-ops if include_input bundled input/ directly
      # already (see its own "already here" check) - either way, this
      # confirms the build is actually runnable end to end, not just
      # that the export step above exited 0: loads
      # input/images/sun/Sun.jpg (the exact failure build-dist.sh's own
      # comment describes finding and fixing), runs a bundled
      # command/test/*.svs script, and produces its screenshot. Running
      # install-assets.sh here, rather than always setting
      # include_input, also means this is exactly what most people
      # downloading this artifact will actually do - a real test of that
      # path, not just the direct-bundle one.
      - name: Install assets, then smoke-test the build
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cd dist/linux-amd64
          ./install-assets.sh
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            ./solarchvision_bim USER=AUTO RUN=command/test/primitives.svs

          SCREENSHOT="$(find projects -name 'primitives.png' -print -quit)"
          if [ -z "$SCREENSHOT" ]; then
            echo "error: primitives.png was not produced - the dist build may be broken" >&2
            exit 1
          fi
          echo "==> Found: $SCREENSHOT"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: solarchvision_bim-linux-amd64
          path: dist/linux-amd64
          retention-days: 7

  build-windows:
    # Cross-exports fine from this same Linux runner (confirmed directly
    # - see build-dist.sh's own comment), so there's no need for an
    # actual windows-latest runner here. The .exe itself can't be run on
    # Linux though, so unlike build-linux above this is unverified
    # beyond having exported without error; ci.yml's test-windows job
    # does run the interactive sketch itself on real Windows, just not
    # this export.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/${{ env.PROCESSING_VERSION }}
          key: processing-${{ env.PROCESSING_VERSION }}-linux-x64

      - name: Install Processing
        if: steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.zip \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64-portable.zip"
          mkdir -p ~/processing
          unzip -q /tmp/processing.zip -d /tmp/processing-extracted
          mv /tmp/processing-extracted/Processing "$HOME/processing/${PROCESSING_VERSION}"

      - name: Build dist (windows-amd64)
        env:
          NO_JAVA: ${{ inputs.bundle_java && '0' || '1' }}
          INCLUDE_INPUT: ${{ inputs.include_input && '1' || '0' }}
        run: |
          export PROCESSING_HOME="$HOME/processing/${PROCESSING_VERSION}"
          chmod +x build-dist.sh
          ./build-dist.sh windows-amd64

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: solarchvision_bim-windows-amd64
          path: dist/windows-amd64
          retention-days: 7

  build-macos:
    # Both macOS variants also cross-export fine from this Linux runner,
    # but only with build-dist.sh's forced --no-java (a Processing export
    # bug otherwise - see its own comment); bundle_java above has no
    # effect here either way. Neither can actually run here (no Mach-O
    # support on a Linux runner), so what's checked below is structural
    # only, not proof either one opens and renders correctly - that
    # needs an actual Mac (if that ever becomes available as a runner
    # here, upgrading this to a real smoke test, the same way
    # build-linux's own works, would be the next step).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/${{ env.PROCESSING_VERSION }}
          key: processing-${{ env.PROCESSING_VERSION }}-linux-x64

      - name: Install Processing
        if: steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.zip \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64-portable.zip"
          mkdir -p ~/processing
          unzip -q /tmp/processing.zip -d /tmp/processing-extracted
          mv /tmp/processing-extracted/Processing "$HOME/processing/${PROCESSING_VERSION}"

      - name: Build dist (macos-x86_64, macos-aarch64)
        env:
          INCLUDE_INPUT: ${{ inputs.include_input && '1' || '0' }}
        run: |
          export PROCESSING_HOME="$HOME/processing/${PROCESSING_VERSION}"
          chmod +x build-dist.sh
          ./build-dist.sh macos-x86_64 macos-aarch64

      - name: Check both builds are structurally complete
        run: |
          for variant in macos-x86_64 macos-aarch64; do
            LAUNCHER="dist/$variant/solarchvision_bim.app/Contents/MacOS/solarchvision_bim"
            JAVA_DIR="dist/$variant/solarchvision_bim.app/Contents/Java"
            if [ ! -f "$LAUNCHER" ]; then
              echo "error: $LAUNCHER is missing - the $variant export may have failed partway through" >&2
              exit 1
            fi
            if ! file "$LAUNCHER" | grep -q 'Mach-O'; then
              echo "error: $LAUNCHER is not a Mach-O binary:" >&2
              file "$LAUNCHER" >&2
              exit 1
            fi
            if [ ! -f "$JAVA_DIR/install-assets.sh" ]; then
              echo "error: install-assets.sh is missing from the $variant bundle's Contents/Java/" >&2
              exit 1
            fi
            # Only expected when include_input was turned on - see
            # build-dist.sh's own INCLUDE_INPUT (off by default, in
            # which case install-assets.sh above is what's expected to
            # provide it instead, unchecked here since neither macOS
            # variant can actually run it on this Linux runner).
            if [ "${{ inputs.include_input }}" = "true" ] && [ ! -d "$JAVA_DIR/input" ]; then
              echo "error: include_input was on, but input/ is missing from the $variant bundle's Contents/Java/" >&2
              exit 1
            fi
            echo "==> $variant: OK ($(file "$LAUNCHER"))"
          done

      - name: Upload macos-x86_64 dist
        uses: actions/upload-artifact@v4
        with:
          name: solarchvision_bim-macos-x86_64
          path: dist/macos-x86_64
          retention-days: 7

      - name: Upload macos-aarch64 dist
        uses: actions/upload-artifact@v4
        with:
          name: solarchvision_bim-macos-aarch64
          path: dist/macos-aarch64
          retention-days: 7
