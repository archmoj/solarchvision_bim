name: OSM 3D import - Node.js (single location)

# Manual only - this hits the public Overpass API for one location, so it
# should not run on every push/PR. Trigger it from the Actions tab (or the
# gh CLI/API) when you actually want a fresh export.
on:
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude (WGS84)'
        required: true
        default: '40.7484'
      lon:
        description: 'Longitude (WGS84)'
        required: true
        default: '-73.9857'
      radius:
        description: 'Radius in meters'
        required: true
        default: '250'
      outdir:
        description: 'Output folder name (holds buildings.obj + more_info.txt)'
        required: true
        default: 'empire_state_area'
      include_parts:
        description: 'Also fetch building:part features (needed for complex/modern buildings modeled as separate parts, e.g. towers/domes with no plain "building" outline of their own)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: import/package-lock.json

      # import/package.json pins earcut, osmtogeojson, proj4 (and an
      # @xmldom/xmldom override - see import/README.md) - npm ci installs
      # exactly what's in import/package-lock.json.
      - name: Install dependencies
        working-directory: import
        run: npm ci

      - name: Run SOLARCHVISION_OSM_3D_in_obj.js
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.include_parts }}" = "true" ]; then
            EXTRA_ARGS="--include-parts"
          fi
          node import/SOLARCHVISION_OSM_3D_in_obj.js \
            --lat "${{ inputs.lat }}" \
            --lon "${{ inputs.lon }}" \
            --radius "${{ inputs.radius }}" \
            --outdir "${{ inputs.outdir }}" \
            $EXTRA_ARGS

      # The step above always writes buildings.obj + more_info.txt into
      # ${{ inputs.outdir }} (see the script's docstring) - upload that
      # whole folder so it shows up as one downloadable zip on the run page.
      - name: Upload output folder
        # The script exits non-zero if buildings succeeded but trees
        # couldn't be fetched (a best-effort layer) - still upload
        # whatever was written rather than silently dropping it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.outdir }}
          path: ${{ inputs.outdir }}
          if-no-files-found: error
          retention-days: 14
