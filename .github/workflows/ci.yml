name: Java CI for solarchvision_bim

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch: # Allows you to also trigger this job manually via the GitHub UI

permissions:
  contents: read

env:
  # Keep these in sync with test/run_tests.sh's PROCESSING_HOME default,
  # test/install_junit.sh's LATEST_VERSION, and test/install_jacoco.sh's
  # LATEST_VERSION.
  PROCESSING_VERSION: 4.3.4
  PROCESSING_TAG: processing-1297-4.3.4
  JUNIT_VERSION: 6.1.3
  JACOCO_VERSION: 0.8.15

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Processing isn't on any package registry, so cache the extracted
      # install across runs - it's a ~220MB download every time otherwise.
      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/${{ env.PROCESSING_VERSION }}
          key: processing-${{ env.PROCESSING_VERSION }}-linux-x64

      - name: Install Processing
        if: steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.tgz \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64.tgz"
          mkdir -p ~/processing
          tar -xf /tmp/processing.tgz -C /tmp
          mv "/tmp/processing-${PROCESSING_VERSION}" "$HOME/processing/${PROCESSING_VERSION}"

      # test/run_tests.sh looks for the JUnit console launcher under
      # test/lib/ - reuse test/install_junit.sh (the same script
      # documented in test/README.md) rather than duplicating the
      # download/verify logic here.
      - name: Cache JUnit console launcher
        id: cache-junit
        uses: actions/cache@v4
        with:
          path: test/lib
          key: junit-console-standalone-${{ env.JUNIT_VERSION }}

      - name: Install JUnit console launcher
        if: steps.cache-junit.outputs.cache-hit != 'true'
        working-directory: test
        run: |
          chmod +x install_junit.sh
          ./install_junit.sh

      # test/run_tests.sh generates a coverage report automatically
      # whenever jacocoagent.jar/jacococli.jar are found under
      # test/lib/jacoco/ - reuse test/install_jacoco.sh (documented in
      # test/README.md) the same way the JUnit launcher is installed
      # above. This is intentionally optional at the run_tests.sh level
      # (a local dev running the tests doesn't need it), but CI always
      # installs it so every run gets a coverage report.
      - name: Cache JaCoCo
        id: cache-jacoco
        uses: actions/cache@v4
        with:
          path: test/lib/jacoco
          key: jacoco-${{ env.JACOCO_VERSION }}

      - name: Install JaCoCo
        if: steps.cache-jacoco.outputs.cache-hit != 'true'
        working-directory: test
        run: |
          chmod +x install_jacoco.sh
          ./install_jacoco.sh

      - name: Run tests
        run: |
          chmod +x test/run_tests.sh
          ./test/run_tests.sh

      # run_tests.sh always writes here when coverage is enabled,
      # win or lose - upload it even if the tests failed above, so a
      # failing PR still shows what was (and wasn't) covered.
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f build/test/coverage/coverage.csv ]; then
            {
              echo "### Coverage"
              echo
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              awk -F, '
                NR == 1 { next }
                {
                  instr_missed += $4; instr_covered += $5;
                  branch_missed += $6; branch_covered += $7;
                  line_missed += $8; line_covered += $9;
                }
                END {
                  printf "| Instructions | %.1f%% (%d/%d) |\n", 100*instr_covered/(instr_covered+instr_missed), instr_covered, instr_covered+instr_missed;
                  printf "| Branches | %.1f%% (%d/%d) |\n", 100*branch_covered/(branch_covered+branch_missed), branch_covered, branch_covered+branch_missed;
                  printf "| Lines | %.1f%% (%d/%d) |\n", 100*line_covered/(line_covered+line_missed), line_covered, line_covered+line_missed;
                }
              ' build/test/coverage/coverage.csv
              echo
              echo "Full HTML/XML report: see the \`coverage-report\` artifact on this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage.csv found - coverage generation may have failed; see the Run tests step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            build/test/coverage/html
            build/test/coverage/coverage.xml
            build/test/coverage/coverage.csv
          if-no-files-found: warn
          retention-days: 2
