name: Java CI for solarchvision_bim

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch: # Allows you to also trigger this job manually via the GitHub UI

permissions:
  contents: read

env:
  # Keep these in sync with test/install_junit.sh's LATEST_VERSION and
  # test/install_jacoco.sh's LATEST_VERSION. Version-independent - shared
  # by both Processing generations in the matrix below.
  JUNIT_VERSION: 6.1.3
  JACOCO_VERSION: 0.8.15

jobs:
  test:
    # Two jobs, not one: test/run_tests.sh (and run-with-processing-4.3.sh/run-with-latest-processing.sh) work
    # with either Processing generation, so both are actually exercised in
    # CI rather than just one. See test/README.md and test/image/README.md's
    # "Setup: Processing 4.5.x" for what differs between them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - processing_version: 4.3.4
            processing_tag: processing-1297-4.3.4
          - processing_version: 4.5.2
            processing_tag: processing-1313-4.5.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Processing isn't on any package registry, so cache the extracted
      # install across runs - it's a large download every time otherwise.
      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/${{ matrix.processing_version }}
          key: processing-${{ matrix.processing_version }}-linux-x64

      # <=4.4.x ships as a .tgz with a processing-java script at the
      # install root (run-with-processing-4.3.sh's expectation).
      - name: Install Processing 4.3.4
        if: matrix.processing_version == '4.3.4' && steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.tgz \
            "https://github.com/processing/processing4/releases/download/${{ matrix.processing_tag }}/processing-${{ matrix.processing_version }}-linux-x64.tgz"
          mkdir -p ~/processing
          tar -xf /tmp/processing.tgz -C /tmp
          mv "/tmp/processing-${{ matrix.processing_version }}" "$HOME/processing/${{ matrix.processing_version }}"

      # 4.5.x+ ships as a "portable" zip (a Processing/ folder with a
      # native launcher at Processing/bin/Processing, run-with-latest-processing.sh's
      # expectation) instead - no processing-java script in this version.
      - name: Install Processing (latest)
        if: matrix.processing_version != '4.3.4' && steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.zip \
            "https://github.com/processing/processing4/releases/download/${{ matrix.processing_tag }}/processing-${{ matrix.processing_version }}-linux-x64-portable.zip"
          mkdir -p ~/processing
          unzip -q /tmp/processing.zip -d /tmp/processing-extracted
          mv /tmp/processing-extracted/Processing "$HOME/processing/${{ matrix.processing_version }}"

      # test/run_tests.sh looks for the JUnit console launcher under
      # test/lib/ - reuse test/install_junit.sh (the same script
      # documented in test/README.md) rather than duplicating the
      # download/verify logic here.
      - name: Cache JUnit console launcher
        id: cache-junit
        uses: actions/cache@v4
        with:
          path: test/lib
          key: junit-console-standalone-${{ env.JUNIT_VERSION }}

      - name: Install JUnit console launcher
        if: steps.cache-junit.outputs.cache-hit != 'true'
        working-directory: test
        run: |
          chmod +x install_junit.sh
          ./install_junit.sh

      # test/run_tests.sh generates a coverage report automatically
      # whenever jacocoagent.jar/jacococli.jar are found under
      # test/lib/jacoco/ - reuse test/install_jacoco.sh (documented in
      # test/README.md) the same way the JUnit launcher is installed
      # above. This is intentionally optional at the run_tests.sh level
      # (a local dev running the tests doesn't need it), but CI always
      # installs it so every run gets a coverage report.
      - name: Cache JaCoCo
        id: cache-jacoco
        uses: actions/cache@v4
        with:
          path: test/lib/jacoco
          key: jacoco-${{ env.JACOCO_VERSION }}

      - name: Install JaCoCo
        if: steps.cache-jacoco.outputs.cache-hit != 'true'
        working-directory: test
        run: |
          chmod +x install_jacoco.sh
          ./install_jacoco.sh

      - name: Run tests
        run: |
          export PROCESSING_HOME="$HOME/processing/${{ matrix.processing_version }}"
          chmod +x test/run_tests.sh
          ./test/run_tests.sh

      # Only on 4.5.2: run-with-processing-4.3.sh (4.3.4) segfaults rendering under Xvfb (see
      # test/run_integration.sh's own comment on this), so there's no
      # working merged-coverage leg to run there. This reuses
      # build/test/jacoco.exec, which the "Run tests" step above just
      # wrote, so the resulting report reflects unit tests AND every
      # command/test/*.svs integration script together, not integration
      # tests alone.
      - name: Run integration tests with merged coverage (Processing 4.5.2 only)
        if: matrix.processing_version == '4.5.2'
        run: |
          export PROCESSING_HOME="$HOME/processing/${{ matrix.processing_version }}"
          chmod +x test/run_integration.sh
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            ./test/run_integration.sh

      # run_tests.sh always writes here when coverage is enabled,
      # win or lose - upload it even if the tests failed above, so a
      # failing PR still shows what was (and wasn't) covered.
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f build/test/coverage/coverage.csv ]; then
            {
              echo "### Coverage (Processing ${{ matrix.processing_version }})"
              echo
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              awk -F, '
                NR == 1 { next }
                {
                  instr_missed += $4; instr_covered += $5;
                  branch_missed += $6; branch_covered += $7;
                  line_missed += $8; line_covered += $9;
                }
                END {
                  printf "| Instructions | %.1f%% (%d/%d) |\n", 100*instr_covered/(instr_covered+instr_missed), instr_covered, instr_covered+instr_missed;
                  printf "| Branches | %.1f%% (%d/%d) |\n", 100*branch_covered/(branch_covered+branch_missed), branch_covered, branch_covered+branch_missed;
                  printf "| Lines | %.1f%% (%d/%d) |\n", 100*line_covered/(line_covered+line_missed), line_covered, line_covered+line_missed;
                }
              ' build/test/coverage/coverage.csv
              echo
              echo "Full HTML/XML report: see the \`coverage-report-${{ matrix.processing_version }}\` artifact on this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage.csv found - coverage generation may have failed; see the Run tests step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Named per Processing version: two jobs in one run would otherwise
      # both try to upload an artifact called "coverage-report".
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.processing_version }}
          path: |
            build/test/coverage/html
            build/test/coverage/coverage.xml
            build/test/coverage/coverage.csv
          if-no-files-found: warn
          retention-days: 2

      # test/run_integration.sh always writes here, win or lose - same
      # reasoning as "Publish coverage summary" above. Only runs on 4.5.2
      # (see "Run integration tests with merged coverage" above), so
      # there's exactly one of these per workflow run, not one per matrix
      # leg.
      - name: Publish merged coverage summary (Processing 4.5.2 only)
        if: always() && matrix.processing_version == '4.5.2'
        run: |
          if [ -f build/merged-coverage/coverage.csv ]; then
            {
              echo "### Coverage: unit tests + integration tests merged (Processing ${{ matrix.processing_version }})"
              echo
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              awk -F, '
                NR == 1 { next }
                {
                  instr_missed += $4; instr_covered += $5;
                  branch_missed += $6; branch_covered += $7;
                  line_missed += $8; line_covered += $9;
                }
                END {
                  printf "| Instructions | %.1f%% (%d/%d) |\n", 100*instr_covered/(instr_covered+instr_missed), instr_covered, instr_covered+instr_missed;
                  printf "| Branches | %.1f%% (%d/%d) |\n", 100*branch_covered/(branch_covered+branch_missed), branch_covered, branch_covered+branch_missed;
                  printf "| Lines | %.1f%% (%d/%d) |\n", 100*line_covered/(line_covered+line_missed), line_covered, line_covered+line_missed;
                }
              ' build/merged-coverage/coverage.csv
              echo
              echo "Full HTML/XML report: see the \`merged-coverage-report\` artifact on this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No build/merged-coverage/coverage.csv found - merged coverage generation may have failed; see the \`Run integration tests with merged coverage\` step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merged coverage report (Processing 4.5.2 only)
        if: always() && matrix.processing_version == '4.5.2'
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-report
          path: |
            build/merged-coverage/html
            build/merged-coverage/coverage.xml
            build/merged-coverage/coverage.csv
          if-no-files-found: warn
          retention-days: 2

  test-windows:
    # Separate from the Linux `test` matrix above rather than an added
    # `os` dimension there, specifically to avoid sprinkling
    # `if: runner.os == ...` through that job's many Linux/Xvfb-specific
    # integration-coverage steps. Only the latest Processing generation -
    # <=4.4.x's processing-java.exe is a real thing (see
    # run-with-processing-4.3.bat), but exercising both generations on
    # every OS doubles the matrix for a combination (old Processing on
    # Windows) nobody's asked to maintain yet.
    #
    # Unit tests, plus an integration/coverage-merge step mirroring the
    # Linux job's - no Xvfb equivalent is needed or available on Windows,
    # since GitHub's windows-latest image provides a real (if software-
    # rendered) display session out of the box, unlike the Linux
    # containers which have no display server at all by default.
    # Whether headless OpenGL/JOGL actually renders correctly there is
    # still something this change can only confirm by actually running
    # it in CI, not with the Linux-only tools available while writing
    # this - treat the first real run of this step as the real test of
    # it, the same way the classpath and path-translation issues in the
    # unit-test step above were only actually found that way too.
    name: Test (Windows, latest Processing)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/4.5.2
          key: processing-4.5.2-windows-x64

      # Same release, same tag, as the Linux job's "Install Processing
      # (latest)" step - just the -windows-x64-portable.zip asset instead
      # of -linux-x64-portable.zip. Unlike the Linux/macOS portable build,
      # Windows' lays out one directory level shallower (Processing.exe +
      # app/ + runtime/ directly under the install root, no lib/ wrapper) -
      # see run-with-latest-processing.bat's and test/run_tests.sh's own
      # comments on this difference.
      - name: Install Processing 4.5.2
        if: steps.cache-processing.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fL -o /tmp/processing.zip \
            "https://github.com/processing/processing4/releases/download/processing-1313-4.5.2/processing-4.5.2-windows-x64-portable.zip"
          mkdir -p ~/processing
          unzip -q /tmp/processing.zip -d /tmp/processing-extracted
          mv /tmp/processing-extracted/Processing "$HOME/processing/4.5.2"

      # test/run_tests.sh looks for the JUnit console launcher under
      # test/lib/ - reuse test/install_junit.sh, same as the Linux job.
      # Windows runners ship Git Bash, which both this and run_tests.sh
      # itself need anyway (shell: bash below) - no separate Windows port
      # of either script.
      - name: Cache JUnit console launcher
        id: cache-junit
        uses: actions/cache@v4
        with:
          path: test/lib
          key: junit-console-standalone-${{ env.JUNIT_VERSION }}

      - name: Install JUnit console launcher
        if: steps.cache-junit.outputs.cache-hit != 'true'
        shell: bash
        working-directory: test
        run: |
          chmod +x install_junit.sh
          ./install_junit.sh

      - name: Cache JaCoCo
        id: cache-jacoco
        uses: actions/cache@v4
        with:
          path: test/lib/jacoco
          key: jacoco-${{ env.JACOCO_VERSION }}

      - name: Install JaCoCo
        if: steps.cache-jacoco.outputs.cache-hit != 'true'
        shell: bash
        working-directory: test
        run: |
          chmod +x install_jacoco.sh
          ./install_jacoco.sh

      - name: Run tests
        shell: bash
        run: |
          export PROCESSING_HOME="$HOME/processing/4.5.2"
          chmod +x test/run_tests.sh
          ./test/run_tests.sh

      # Mirrors the Linux job's "Run integration tests with merged
      # coverage" - reuses build/test/jacoco.exec, which the step above
      # just wrote, so the resulting report reflects unit tests AND
      # every command/test/*.svs integration script together. No
      # xvfb-run wrapper (see the job-level comment on why none is
      # needed here).
      #
      # It does need real OpenGL though, which the runner doesn't have:
      # windows-latest ships no GPU/OpenGL ICD at all (confirmed by this
      # step's own first real run: "Framebuffer objects are not
      # supported by this hardware (or driver)" - the ancient,
      # FBO-less Microsoft generic software implementation is all
      # that's present otherwise). pal1000/mesa-dist-win is a maintained
      # prebuilt Windows distribution of Mesa3D's llvmpipe software
      # rasterizer - the direct Windows equivalent of the Mesa package
      # the Linux job gets from apt for the same reason. Overwriting
      # System32's copy (not just placing it next to java.exe) is what
      # makes every process's plain LoadLibrary("opengl32.dll") -
      # including the JVM JOGL loads into - pick it up with no further
      # configuration; the default runner account has the admin rights
      # this needs. PowerShell (the Windows job's default shell, not
      # bash) specifically to keep this System32 write on native
      # Windows path handling throughout, rather than adding another
      # path through Git Bash's MSYS translation layer right after three
      # straight rounds of exactly that causing the last three bugs here.
      - name: Install Mesa3D software OpenGL (no GPU/ICD on this runner)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/25.3.6/mesa3d-25.3.6-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z -omesa
          # Not a blanket *.dll copy: Mesa's package also bundles files
          # that happen to share a name with Windows-protected system
          # DLLs it doesn't actually provide functionality for here
          # (d3d10warp.dll - Microsoft's own D3D10 software rasterizer -
          # is locked even for an admin account, confirmed by this step's
          # own first real run). Only copying the specific files the
          # OpenGL software path actually needs avoids touching anything
          # else in System32 at all.
          #
          # opengl32.dll turned out to be locked the same way, despite
          # being the one file this step exists to replace - Windows
          # Resource Protection restricts some System32 files even from
          # an administrator account's default rights. take ownership
          # and grant Administrators full control first, the standard
          # (and only reliable) way to override that - plain
          # administrator membership isn't enough on its own.
          function Install-SystemDll($source, $destination) {
            if (Test-Path $destination) {
              takeown /f $destination /a | Out-Null
              icacls $destination /grant Administrators:F | Out-Null
            }
            Copy-Item -Path $source -Destination $destination -Force
          }

          Install-SystemDll "mesa\x64\opengl32.dll" "$env:SystemRoot\System32\opengl32.dll"
          if (Test-Path "mesa\x64\libglapi.dll") {
            Install-SystemDll "mesa\x64\libglapi.dll" "$env:SystemRoot\System32\libglapi.dll"
          }
          if (Test-Path "mesa\x64\libgallium_wgl.dll") {
            Install-SystemDll "mesa\x64\libgallium_wgl.dll" "$env:SystemRoot\System32\libgallium_wgl.dll"
          }

      # WGL_SWAP_INTERVAL=0 - see image-tests.yml's "Generate test images
      # (make_baseline.py)" step for the full explanation (a documented
      # Mesa gallium/wgl bug: SwapBuffers can freeze when an application
      # negotiates a swap interval, which JOGL does). Applied here too,
      # proactively: this step's own success criterion (test/run_integration.sh's
      # non-empty .exec file check) only confirms some code ran, not that
      # rendering/REC.png actually completed, so the same hang could be
      # silently eating a test here without ever surfacing as a failure.
      - name: Run integration tests with merged coverage
        shell: bash
        env:
          WGL_SWAP_INTERVAL: '0'
        run: |
          export PROCESSING_HOME="$HOME/processing/4.5.2"
          chmod +x test/run_integration.sh
          ./test/run_integration.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-windows-4.5.2
          path: |
            build/test/coverage/html
            build/test/coverage/coverage.xml
            build/test/coverage/coverage.csv
          if-no-files-found: warn
          retention-days: 2

      # Named distinctly from the Linux job's "merged-coverage-report" -
      # both jobs run in the same workflow, and two artifacts with the
      # same name would collide.
      - name: Publish merged coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f build/merged-coverage/coverage.csv ]; then
            {
              echo "### Coverage: unit tests + integration tests merged (Windows, Processing 4.5.2)"
              echo
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              awk -F, '
                NR == 1 { next }
                {
                  instr_missed += $4; instr_covered += $5;
                  branch_missed += $6; branch_covered += $7;
                  line_missed += $8; line_covered += $9;
                }
                END {
                  printf "| Instructions | %.1f%% (%d/%d) |\n", 100*instr_covered/(instr_covered+instr_missed), instr_covered, instr_covered+instr_missed;
                  printf "| Branches | %.1f%% (%d/%d) |\n", 100*branch_covered/(branch_covered+branch_missed), branch_covered, branch_covered+branch_missed;
                  printf "| Lines | %.1f%% (%d/%d) |\n", 100*line_covered/(line_covered+line_missed), line_covered, line_covered+line_missed;
                }
              ' build/merged-coverage/coverage.csv
              echo
              echo "Full HTML/XML report: see the \`merged-coverage-report-windows\` artifact on this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No build/merged-coverage/coverage.csv found - merged coverage generation may have failed; see the \`Run integration tests with merged coverage\` step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-report-windows
          path: |
            build/merged-coverage/html
            build/merged-coverage/coverage.xml
            build/merged-coverage/coverage.csv
          if-no-files-found: warn
          retention-days: 2
