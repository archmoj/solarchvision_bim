name: OSM 3D import - Python (single location)

# Manual only - this hits the public Overpass API for one location, so it
# should not run on every push/PR. Trigger it from the Actions tab (or the
# gh CLI/API) when you actually want a fresh export.
on:
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude (WGS84)'
        required: true
        default: '40.7484'
      lon:
        description: 'Longitude (WGS84)'
        required: true
        default: '-73.9857'
      radius:
        description: 'Radius in meters'
        required: true
        default: '250'
      outdir:
        description: 'Output folder name (holds buildings.obj + buildings.svs + more_info.svs)'
        required: true
        default: 'empire_state_area'
      include_parts:
        description: 'Also fetch building:part features (needed for complex/modern buildings modeled as separate parts, e.g. towers/domes with no plain "building" outline of their own)'
        required: false
        type: boolean
        default: false
      material:
        description: 'Material index (m:) for buildings.svs Mesh lines'
        required: false
        default: '7'
      tessellation:
        description: 'Tessellation index (tes:) for buildings.svs Mesh lines'
        required: false
        default: '0'
      layer:
        description: 'Layer index (lyr:) for buildings.svs Mesh lines'
        required: false
        default: '0'
      no_buildings_svs:
        description: 'Skip writing buildings.svs (the SOLARCHVISION_BIM Mesh-command form)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: import/requirements-osm.txt

      # Matches import/README.md's "Setup" section. osmnx pulls in a heavy
      # transitive stack (geopandas, shapely, pyproj, pandas, numpy, ...)
      # with compiled wheels; the cache above avoids re-downloading all of
      # that on every run - this step is a no-op on a cache hit.
      - name: Install dependencies
        run: pip install -r import/requirements-osm.txt

      - name: Run SOLARCHVISION_OSM_3D_in_obj.py
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.include_parts }}" = "true" ]; then
            EXTRA_ARGS="--include-parts"
          fi
          if [ "${{ inputs.no_buildings_svs }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-buildings-svs"
          fi
          python import/SOLARCHVISION_OSM_3D_in_obj.py \
            --lat "${{ inputs.lat }}" \
            --lon "${{ inputs.lon }}" \
            --radius "${{ inputs.radius }}" \
            --outdir "${{ inputs.outdir }}" \
            --material "${{ inputs.material }}" \
            --tessellation "${{ inputs.tessellation }}" \
            --layer "${{ inputs.layer }}" \
            $EXTRA_ARGS

      # The step above always writes buildings.obj + buildings.svs +
      # more_info.svs into ${{ inputs.outdir }} (see the script's
      # docstring) - upload that whole folder so it shows up as one
      # downloadable zip on the run page.
      - name: Upload output folder
        # The script exits non-zero if buildings succeeded but trees
        # couldn't be fetched (a best-effort layer) - still upload
        # whatever was written rather than silently dropping it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.outdir }}
          path: ${{ inputs.outdir }}
          if-no-files-found: error
          retention-days: 14
