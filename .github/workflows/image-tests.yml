name: Image tests

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Keep in sync with .github/workflows/ci.yml and run.sh.
  PROCESSING_VERSION: 4.3.4
  PROCESSING_TAG: processing-1297-4.3.4

jobs:
  image-tests:
    # Not ubuntu-latest (24.04): its GLVND-based Mesa build segfaults inside
    # libGLX_mesa.so when JOGL (bundled in Processing 4.3.4) sets up its
    # shared GL context, regardless of LIBGL_ALWAYS_SOFTWARE / vblank_mode /
    # __GLX_VENDOR_LIBRARY_NAME - the crash address never moves, which
    # points to an ABI mismatch rather than a config problem. Ubuntu 22.04's
    # older Mesa doesn't hit this; see actions/runner-images#11517 for the
    # same class of Mesa-on-24.04 regression in other projects.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Same cache key/path as ci.yml, so both workflows share the download.
      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/${{ env.PROCESSING_VERSION }}
          key: processing-${{ env.PROCESSING_VERSION }}-linux-x64

      - name: Install Processing
        if: steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.tgz \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64.tgz"
          mkdir -p ~/processing
          tar -xf /tmp/processing.tgz -C /tmp
          mv "/tmp/processing-${PROCESSING_VERSION}" "$HOME/processing/${PROCESSING_VERSION}"

      # xvfb-run ships preinstalled on ubuntu-22.04 too, so there's nothing
      # to apt-get for the display itself - just the Python side of the
      # image diff.
      - name: Install image-diff dependencies
        run: pip install pillow numpy

      # One process per test, retried on its own if it fails - see
      # make_baseline.py's docstring. No wrapping retry action here: a
      # whole-batch retry would re-run every test that already succeeded
      # just because one flaked, which is exactly what per-test retry
      # inside the script avoids. timeout-minutes is a last-resort safety
      # net in case xvfb-run/Xvfb itself hangs, not the normal path -
      # PER_TEST_TIMEOUT (default 300s) bounds each test's own attempts.
      - name: Generate test images (make_baseline.py)
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          python3 test/image/make_baseline.py

      # Always runs, even if generation above had failures, so whatever did
      # get produced is still compared and its diff is visible.
      - name: Compare pixels (compare_pixels.py)
        if: always()
        run: python3 test/image/compare_pixels.py

      # No separate "update baselines" workflow: a missing baseline (a new
      # test) or a notable diff (a real regression, or a rendering change
      # that's actually fine) both make compare_pixels.py fail above, which
      # is exactly when there's something worth a human's attention.
      # test/image/actual/ doubles as the set of candidate new baselines:
      # download this artifact, look at the images (and their diffs against
      # whatever baseline did exist), and commit the ones that are actually
      # correct into test/image/baseline/.
      - name: Upload new/changed baseline candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: new-baselines
          path: |
            test/image/actual
            test/image/diff
          if-no-files-found: warn
          retention-days: 14
