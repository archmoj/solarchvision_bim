name: Image tests

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  PROCESSING_VERSION: 4.5.2
  PROCESSING_TAG: processing-1313-4.5.2
  # How many parallel containers generate images. Kept as one number here
  # (rather than repeated in the matrix list below) since SHARD_TOTAL must
  # match the matrix length - see the "shard" section of
  # test/image/README.md if this ever needs to change.
  SHARD_TOTAL: 3

jobs:
  # Generation is the flaky half of this pipeline (one JVM/GL/Xvfb startup
  # per test), so it's split across SHARD_TOTAL parallel containers - each
  # runs only every SHARD_TOTAL-th test (make_baseline.py's own
  # SHARD_INDEX/SHARD_TOTAL striping). Comparison happens once, in a
  # separate job below, against all shards' images merged together.
  generate-images:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    # ubuntu-latest, not pinned to an older image: Processing 4.3.4's
    # bundled JOGL used to segfault on ubuntu-24.04's newer GLVND-based
    # Mesa when setting up its shared GL context (an ABI mismatch, not a
    # config problem - actions/runner-images#11517 has the same class of
    # regression for another project). Confirmed resolved by the Processing
    # 4.5.2 upgrade below (bundled JOGL 2.6.0) - see test/image/README.md's
    # "Note on upgrading Processing".
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/${{ env.PROCESSING_VERSION }}
          key: processing-${{ env.PROCESSING_VERSION }}-linux-x64

      # 4.5.x ships as a "portable" zip (Processing/ folder with a native
      # jpackage launcher at Processing/bin/Processing), not the old
      # processing-<version>-linux-x64.tgz with a processing-java script -
      # that script no longer exists in this version. See
      # test/image/README.md's "Note on upgrading Processing".
      - name: Install Processing
        if: steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.zip \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64-portable.zip"
          mkdir -p ~/processing
          unzip -q /tmp/processing.zip -d /tmp/processing-extracted
          mv /tmp/processing-extracted/Processing "$HOME/processing/${PROCESSING_VERSION}"

      # The new Processing cli resolves sketchPath()/BaseFolder to its own
      # install directory (lib/app/resources/core) instead of the sketch's
      # actual working directory - a real behavior change from 4.3.4, not
      # a path bug on our end. Without this, the sketch can't find its own
      # asset files (input/, command/, and where it writes projects/...
      # screenshots). See test/image/README.md's "Note on upgrading
      # Processing" for how this was diagnosed. Re-run every job (not
      # cached like the install above) since $GITHUB_WORKSPACE is a fresh
      # checkout path each time.
      - name: Link repo directories into Processing's resolved base folder
        run: |
          CORE="$HOME/processing/${PROCESSING_VERSION}/lib/app/resources/core"
          mkdir -p "$GITHUB_WORKSPACE/projects"
          ln -sfn "$GITHUB_WORKSPACE/input" "$CORE/input"
          ln -sfn "$GITHUB_WORKSPACE/command" "$CORE/command"
          ln -sfn "$GITHUB_WORKSPACE/projects" "$CORE/projects"

      # One process per test, retried on its own if it fails - see
      # make_baseline.py's docstring. No wrapping retry action here: a
      # whole-batch retry would re-run every test in this shard that already
      # succeeded just because one flaked, which is exactly what per-test
      # retry inside the script avoids.
      #
      # --server-args sets the virtual display to 1920x1080: the sketch's
      # main window is fullScreen(P2D), so the screenshot dimensions match
      # whatever Xvfb's screen is - left at xvfb-run's default (1280x1024)
      # the images come out 1280x1024 instead.
      #
      # timeout-minutes is a last-resort safety net (e.g. if xvfb-run/Xvfb
      # itself hangs), not the normal path: each test now takes roughly
      # 30s end to end (mostly JVM startup/compilation, not the render -
      # see test/image/README.md), so 10 minutes covers all 7 tests with
      # real headroom even unsharded.
      - name: Generate this shard's test images (make_baseline.py)
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SHARD_INDEX: ${{ matrix.shard }}
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          python3 test/image/make_baseline.py

      # Short retention: this is an intermediate artifact consumed by
      # compare-pixels below within the same workflow run, not something
      # anyone needs to keep around or download directly.
      - name: Upload this shard's images
        uses: actions/upload-artifact@v4
        with:
          name: actual-images-${{ matrix.shard }}
          path: test/image/actual
          if-no-files-found: error
          retention-days: 1

  compare-pixels:
    needs: generate-images
    # No Processing/GL/Xvfb here at all - pure Python image diffing.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install image-diff dependencies
        run: pip install pillow numpy

      # Collects every shard's actual-images-N artifact into one
      # test/image/actual/ before comparing, so this step sees the full set
      # of tests regardless of how many containers generated them.
      - name: Download and merge all shards' images
        uses: actions/download-artifact@v5
        with:
          pattern: actual-images-*
          path: test/image/actual
          merge-multiple: true

      - name: Compare pixels (compare_pixels.py)
        run: python3 test/image/compare_pixels.py

      # A missing baseline (a brand new test) or a notable diff (a real
      # regression, or a rendering change that's actually fine) both make
      # compare_pixels.py fail above, which is exactly when there's
      # something worth a human's attention - so only upload then.
      # test/image/actual/ doubles as the set of candidate new baselines:
      # download this artifact, look at the images (and their diffs against
      # whatever baseline did exist), and commit the ones that are actually
      # correct into test/image/baseline/.
      - name: Upload new/changed baseline candidates
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: new-baselines
          path: |
            test/image/actual
            test/image/diff
          if-no-files-found: warn
          retention-days: 14
