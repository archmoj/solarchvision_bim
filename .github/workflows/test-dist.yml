name: Test distributable

# Every push, unlike dist.yml (button-triggered only, for an actual
# release download) - this is CI coverage for build-dist.sh/
# flatten-dist.sh themselves and the flat dist/ layout they produce
# (now committed in the repo - see its own README), not something
# meant to be downloaded afterward. workflow_dispatch alongside it just
# for an easy manual re-run.
on:
  push:
    branches: '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Kept in sync with ci.yml's, dist.yml's and image-tests.yml's own
  # pin, so build-dist (the only job below that actually needs
  # Processing installed - the other three just run what it already
  # built) reuses the exact same ~/processing/4.5.2 cache entry those
  # already populate.
  PROCESSING_VERSION: 4.5.2
  PROCESSING_TAG: processing-1313-4.5.2

jobs:
  # The only job that needs Processing installed at all - the three
  # below just run what this one already built, on their own real OS.
  # One job, not split per variant/OS the way dist.yml's own build-*
  # jobs are: build-dist.sh cross-exports every variant fine from a
  # single Linux host regardless (confirmed repeatedly across this
  # project's history - see build-dist.sh's own comments), and splitting
  # this particular job wouldn't save any wall-clock time anyway, since
  # the three test jobs below (the actually slow, platform-specific
  # part) already run in parallel once this one finishes.
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Processing install
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: ~/processing/${{ env.PROCESSING_VERSION }}
          key: processing-${{ env.PROCESSING_VERSION }}-linux-x64

      - name: Install Processing
        if: steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/processing.zip \
            "https://github.com/processing/processing4/releases/download/${PROCESSING_TAG}/processing-${PROCESSING_VERSION}-linux-x64-portable.zip"
          mkdir -p ~/processing
          unzip -q /tmp/processing.zip -d /tmp/processing-extracted
          mv /tmp/processing-extracted/Processing "$HOME/processing/${PROCESSING_VERSION}"

      # Explicit, even though build-dist.sh already does this same
      # rm -rf internally (see its own comment on why) - belt and
      # suspenders against this job ever picking up whatever dist/
      # happened to already be on disk (the committed copy, from
      # actions/checkout above) rather than a genuinely fresh build.
      - name: Empty dist/
        run: rm -rf dist

      - name: Build dist (linux-amd64, windows-amd64, macos-x86_64, macos-aarch64)
        run: |
          export PROCESSING_HOME="$HOME/processing/${PROCESSING_VERSION}"
          chmod +x build-dist.sh
          ./build-dist.sh linux-amd64 windows-amd64 macos-x86_64 macos-aarch64

      - name: Flatten dist (same variants)
        run: |
          chmod +x flatten-dist.sh
          ./flatten-dist.sh linux-amd64 windows-amd64 macos-x86_64 macos-aarch64

      # One tar per OS below, not one tar (or a plain actions/upload-
      # artifact) for the whole dist/ folder, for two reasons confirmed
      # directly rather than assumed:
      #
      # 1. upload-artifact's default zip packaging does not preserve
      #    Unix file permissions at all - every file comes back 644,
      #    confirmed in its own README ("Permission Loss") - which would
      #    silently strip the executable bit from both
      #    solarchvision_bim_linux-amd64 (a shell script) and the
      #    Mach-O binary inside each .app bundle. tar (with
      #    archive: false below, so upload-artifact doesn't re-zip the
      #    tar itself) preserves permissions - and symlinks - correctly;
      #    confirmed directly here too, not just taken on faith: tarred
      #    a flattened macos-aarch64 build, extracted it elsewhere, and
      #    both the launcher's executable bit and the
      #    Contents/Java/data -> ../../../data symlink (see
      #    flatten-dist.sh) came through intact, the symlink still
      #    resolving to the exact same font file.
      #
      # 2. Scoped to one OS's own files - its executable plus the
      #    shared lib/ and data/ its launcher actually reads (see
      #    flatten-dist.sh's own comment on why those are shared in the
      #    first place) - rather than the whole dist/ folder, so the
      #    test-windows job below never has to extract a tar containing
      #    macOS's own symlinks at all (Windows can create symlinks, but
      #    not without elevated privileges by default - simplest to
      #    just not hand it any).
      - name: Package each OS's own files
        run: |
          tar -czf dist-linux-amd64.tar.gz -C dist solarchvision_bim_linux-amd64 lib data
          tar -czf dist-windows-amd64.tar.gz -C dist solarchvision_bim_windows-amd64.exe lib data
          tar -czf dist-macos-aarch64.tar.gz -C dist solarchvision_bim_macos-aarch64.app lib data

      - name: Upload linux-amd64 package
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist-linux-amd64.tar.gz
          archive: false
          retention-days: 1

      - name: Upload windows-amd64 package
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-amd64
          path: dist-windows-amd64.tar.gz
          archive: false
          retention-days: 1

      - name: Upload macos-aarch64 package
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-aarch64
          path: dist-macos-aarch64.tar.gz
          archive: false
          retention-days: 1

  # Three jobs below, all needs: build-dist and nothing else between
  # them, so GitHub runs them in parallel once it finishes - matching
  # dist.yml's own build-linux/build-windows/build-macos split (see its
  # comment) for the same reason: a failure testing one platform
  # shouldn't hold up, or get bundled in with, the others.

  test-linux:
    needs: build-dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # Not for building anything here - just so a real, non-headless
      # `java` is on PATH for the launcher below to find (build-dist.sh
      # defaults to NO_JAVA=1 - no bundled runtime - so this dist build
      # needs one already installed, same as any real user's machine
      # would; see build-dist.sh's own comment on why not a "headless"
      # JRE specifically).
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download dist-linux-amd64 package
        uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64

      # Replaces the repo's own committed dist/ (from actions/checkout
      # above) with this run's freshly built one - input/ and command/
      # (needed below) come from the checkout either way, unaffected.
      - name: Extract into dist/
        run: |
          rm -rf dist
          mkdir -p dist
          tar -xzf dist-linux-amd64.tar.gz -C dist

      # Confirms this is actually runnable end to end, not just that
      # build-dist produced something - loads input/images/sun/Sun.jpg
      # (locateBaseFolder() walking up from dist/ to find input/, now
      # that dist/ sits inside the repo rather than needing a separate
      # fetch - see update_folders.pde), runs a bundled
      # command/test/*.svs script, and produces its screenshot. Same
      # check as dist.yml's own linux smoke test.
      #
      # timeout-minutes defensively, same reasoning as test-macos's own
      # (see its comment) - this one's never actually hung, but nothing
      # stops some future regression making it the next one that does,
      # and a step with no timeout at all defaults to GitHub's own
      # 6-hour job timeout quietly eating the run if it ever happens.
      - name: Smoke-test the build
        timeout-minutes: 3
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x dist/solarchvision_bim_linux-amd64
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            dist/solarchvision_bim_linux-amd64 USER=AUTO RUN=command/test/primitives.svs

          SCREENSHOT="$(find projects -name 'primitives.png' -print -quit)"
          if [ -z "$SCREENSHOT" ]; then
            echo "error: primitives.png was not produced - the dist build may be broken" >&2
            exit 1
          fi
          echo "==> Found: $SCREENSHOT"

  test-windows:
    needs: build-dist
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download dist-windows-amd64 package
        uses: actions/download-artifact@v4
        with:
          name: dist-windows-amd64

      - name: Extract into dist/
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          tar -xzf dist-windows-amd64.tar.gz -C dist

      # windows-latest ships no GPU/OpenGL ICD at all - same issue, same
      # fix, as ci.yml's own test-windows job (see its much longer
      # comment on this for the details: Windows Resource Protection
      # locking some System32 files even from an administrator account,
      # why opengl32.dll specifically needs to be overwritten there
      # rather than placed next to java.exe, and so on).
      - name: Install Mesa3D software OpenGL (no GPU/ICD on this runner)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/25.3.6/mesa3d-25.3.6-release-msvc.7z" -OutFile mesa.7z
          7z x mesa.7z -omesa
          function Install-SystemDll($source, $destination) {
            if (Test-Path $destination) {
              takeown /f $destination /a | Out-Null
              icacls $destination /grant Administrators:F | Out-Null
            }
            Copy-Item -Path $source -Destination $destination -Force
          }

          Install-SystemDll "mesa\x64\opengl32.dll" "$env:SystemRoot\System32\opengl32.dll"
          if (Test-Path "mesa\x64\libglapi.dll") {
            Install-SystemDll "mesa\x64\libglapi.dll" "$env:SystemRoot\System32\libglapi.dll"
          }
          if (Test-Path "mesa\x64\libgallium_wgl.dll") {
            Install-SystemDll "mesa\x64\libgallium_wgl.dll" "$env:SystemRoot\System32\libgallium_wgl.dll"
          }

      # No Xvfb-equivalent needed - windows-latest provides a real (if
      # software-rendered, as of the step above) display session out of
      # the box, same as ci.yml's own test-windows job.
      #
      # pwsh, not bash: this step's first real run failed with "Could
      # not find or load main class solarchvision_bim" - the exe
      # launched and invoked java fine, but whatever classpath it
      # received didn't resolve to a real solarchvision_bim.jar, despite
      # a listing right before confirming it genuinely existed at the
      # expected path and size. Traced all the way to the actual fix
      # (--l4j-debug-all's own launch4j.log output, printed on that run,
      # confirmed it): launch4j's %EXEDIR%, despite being documented as
      # based on the exe's own file location rather than the process's
      # working directory, apparently still needed that run's Push-
      # Location dist/ to resolve the classpath correctly in practice -
      # matching how a person would actually run this anyway (double-
      # clicking it in Explorer starts it with dist/ itself as the
      # working directory already). RUN='s own path has to be computed
      # absolute before that Push-Location, since Processing's own
      # loadStrings() (unlike %EXEDIR%) does resolve a relative path
      # against the process's working directory - confirmed directly
      # too, the very next run got past the classpath failure entirely,
      # only to then fail to find "command/test/primitives.svs"
      # specifically, since that relative path now meant
      # dist/command/test/... instead.
      #
      # LIBGL_ALWAYS_SOFTWARE=1 below, not WGL_SWAP_INTERVAL=0 (what an
      # earlier version of this step carried over from ci.yml's own
      # comment) - the latter turned out to not be a real, recognized
      # setting at all ("illegal environment value for
      # wgl_swap_interval: '0'. Ignoring."), apparently a leftover from
      # some earlier, since-abandoned workaround attempt; ci.yml's own
      # comment pointed at image-tests.yml for "the full explanation",
      # but image-tests.yml's actual, current Windows job only sets
      # LIBGL_ALWAYS_SOFTWARE=1 - its own comment there describes having
      # moved on from "the .bat-delegation workaround this previously
      # needed" to just that one variable. ci.yml's test-windows job
      # looks to have the same now-stale WGL_SWAP_INTERVAL left in it,
      # worth fixing there too.
      # Start-Process -Wait -PassThru, not the plain & call this step
      # used before - that captured $LASTEXITCODE right after the call,
      # on its own line, which should have worked but kept coming back
      # empty across several runs regardless ("exited with code " with
      # nothing after it) - a known PowerShell rough edge: $LASTEXITCODE
      # only reliably reflects the most recent native command, and
      # anything at all running between that command and reading it
      # (even just entering/leaving the try/finally block around
      # Push-Location/Pop-Location, here) risks clearing or never
      # setting it in the first place. Start-Process's own returned
      # process object carries its exit code as a real, direct property
      # instead, unaffected by any of that. Also redirects stdout/
      # stderr to files, printed below either way - the exe's own
      # output had been showing up, but out of chronological order
      # relative to this step's own Write-Error line in every run so
      # far, suggesting the & call's inherited-stream approach wasn't
      # capturing it cleanly either; files read back afterward sidestep
      # that same way.
      #
      # timeout-minutes defensively, same reasoning as test-macos's own
      # (see its comment) - a step with no timeout at all defaults to
      # GitHub's own 6-hour job timeout quietly eating the run if a
      # future regression ever makes this one hang instead of failing
      # outright the way its own early rounds did.
      - name: Smoke-test the build
        timeout-minutes: 3
        shell: pwsh
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          $ErrorActionPreference = "Stop"

          # Absolute, since Processing's own loadStrings() resolves a
          # relative RUN= path against the working directory below, not
          # the exe's own location the way launch4j's %EXEDIR% is - see
          # this step's own comment above.
          $scriptPath = Join-Path (Get-Location).Path "command\test\primitives.svs"

          # -WorkingDirectory only sets the spawned process's own
          # working directory - it does not make -FilePath resolve
          # relative to it. -FilePath still has to be fully qualified
          # itself (confirmed directly: a bare filename here, relying on
          # -WorkingDirectory to supply the dist\ part, got "The system
          # cannot find the file specified" - PowerShell was resolving
          # it against this script's own location, the repo root, not
          # dist\, before the process was even started).
          $exePath = Join-Path (Get-Location).Path "dist\solarchvision_bim_windows-amd64.exe"

          $process = Start-Process `
            -FilePath $exePath `
            -ArgumentList @("USER=AUTO", "RUN=$scriptPath") `
            -WorkingDirectory "dist" `
            -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput "stdout.log" `
            -RedirectStandardError "stderr.log"

          Write-Host "==> stdout.log:"
          if (Test-Path "stdout.log") { Get-Content "stdout.log" }
          Write-Host "==> stderr.log:"
          if (Test-Path "stderr.log") { Get-Content "stderr.log" }

          if ($process.ExitCode -ne 0) {
            Write-Error "solarchvision_bim_windows-amd64.exe exited with code $($process.ExitCode)"
            exit 1
          }

          $screenshot = Get-ChildItem -Path projects -Filter primitives.png -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $screenshot) {
            Write-Error "primitives.png was not produced - the dist build may be broken"
            exit 1
          }
          Write-Host "==> Found: $($screenshot.FullName)"

  test-macos:
    needs: build-dist
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download dist-macos-aarch64 package
        uses: actions/download-artifact@v4
        with:
          name: dist-macos-aarch64

      - name: Extract into dist/
        run: |
          rm -rf dist
          mkdir -p dist
          tar -xzf dist-macos-aarch64.tar.gz -C dist

      # macos-latest is Apple Silicon (arm64) as of this writing, hence
      # macos-aarch64 specifically rather than macos-x86_64 here -
      # build-dist.sh still builds both (dist.yml's own macOS downloads
      # offer both architectures), just only this one gets an actual
      # run in CI.
      #
      # codesign --sign - (ad hoc) is not optional on Apple Silicon, and
      # this step's first real run confirmed that the hard way: killed
      # immediately with signal 9, no other output at all. Since macOS
      # 11, arm64 refuses to execute ANY unsigned binary at the kernel
      # level - an ad hoc signature (no real certificate/identity
      # needed) is enough, but some signature is mandatory; Intel macOS
      # only warns via Gatekeeper for the same case, which is a
      # materially different problem with a different fix (and the
      # reason this one wasn't anticipated while writing this against
      # an x86_64 assumption, since the Linux cross-export flatten-
      # dist.sh's own "unsigned" note was written against - see its
      # comment). --deep re-signs everything inside the bundle, not
      # just the top-level launcher, in case that matters once other
      # parts of it (the jar symlinks, etc.) actually get exercised
      # rather than just started. xattr -cr first, still defensively -
      # CI downloads don't go through the LSQuarantine APIs that
      # normally set it, so Gatekeeper likely isn't in play here either
      # way, but costs nothing to clear regardless. chmod +x the
      # launcher the same belt-and-suspenders way as test-linux's own,
      # even though the tar round-trip this went through was directly
      # confirmed (see build-dist's own "Package each OS's own files"
      # comment) to preserve it already.
      #
      # Unverified beyond that confirmation, the codesign fix itself
      # (widely documented for exactly this symptom, but not something
      # this project can run and check directly either), and the same
      # well-documented, symlink-transparent file handling the rest of
      # this project's macOS work has had to rely on throughout (no Mac
      # available while writing any of it) - treat this step's next
      # real run as the actual test, the same way test-windows's own
      # pwsh switch is.
      # timeout-minutes: this step's own first two real runs both idled
      # indefinitely rather than failing outright or printing anything
      # past the codesign step above - no "cannot find display"-style
      # error the way Linux gives, no crash, just nothing. Without a
      # step timeout that's indistinguishable from GitHub's own default
      # 6-hour job timeout quietly eating the whole run. GitHub's own
      # macOS runners are documented as not needing the Linux/Windows-
      # style headless-display workaround in the first place (unlike
      # windows-latest, which genuinely has no GPU/ICD at all - see the
      # Mesa3D step above), so what's actually hanging here, rather than
      # erroring the way a genuinely missing display would, is still
      # unconfirmed - this bounds the open question rather than
      # resolving it outright, same as test-windows's own early rounds
      # needed more than one pass to actually pin down.
      # Info.plist (read right before this, same job) turns out to be
      # the classic Apple "JavaAppLauncher"-style stub (JVMMainClassName/
      # JVMOptions/JVMArguments keys, no explicit -cp anywhere - this
      # format auto-adds Contents/Java/*.jar itself). Added
      # -XstartOnFirstThread to JVMOptions there first (a well-documented
      # macOS requirement - Cocoa/AWT windowing has to run on the actual
      # OS main thread, or a JVM can hang indefinitely trying to create a
      # window rather than throwing anything) and it made no difference -
      # confirmed why directly rather than guessing again: the process
      # list taken after that run's own 20-second wait showed exactly
      # one process, the native Contents/MacOS/solarchvision_bim stub
      # itself, no separate java process anywhere. Whatever's hanging is
      # inside that stub's own startup, before it ever gets around to
      # invoking java at all - almost certainly its own JVM-discovery
      # step (this launcher format is known to search standard install
      # locations such as /Library/Java/JavaVirtualMachines/ for one
      # matching Info.plist's JVMVersion), the exact same category of
      # problem as test-windows's own launch4j registry search, just a
      # macOS-flavored version of it: actions/setup-java's JDK doesn't
      # necessarily get installed in a way this stub's own search logic
      # recognizes. -XstartOnFirstThread only affects what happens once
      # a JVM actually starts, so it was never going to help with a hang
      # that happens before one does.
      #
      # Given that, this bypasses the native stub entirely rather than
      # keep chasing its own JVM-discovery logic: builds the classpath
      # directly from Contents/Java/*.jar (the same jars the stub itself
      # would have used - this launcher format's own "auto-add every jar
      # in here" convention, confirmed from Info.plist, is exactly what
      # this replicates by hand) and invokes java - the one
      # actions/setup-java just put on PATH - directly, main class name
      # taken from Info.plist's own JVMMainClassName, -XstartOnFirstThread
      # kept (still true that Cocoa/AWT windowing needs it, even though
      # it wasn't this run's actual blocker), -Djava.library.path matched
      # to what Info.plist's own JVMOptions already specified for JOGL's
      # native library loading.
      #
      # That run's own thread dump (SIGQUIT below, same safety net as
      # before) pinned the actual hang down precisely: the main thread
      # waiting on the AWT event dispatch thread, which was stuck -
      # RUNNABLE, not blocked, just never returning - inside a *native*
      # call, sun.lwawt.macosx.LWCToolkit.getMultiClickTime, reached via
      # JAWTUtil's own static init (triggered by JOGL's NativeWindowFactory
      # probing AWT availability generically at startup, regardless of
      # NEWT being what Processing's own PSurfaceJOGL actually uses for
      # the window itself). That's not a new, unknown failure - it's
      # JDK-8208702 ("HangDuringStaticInitialization... may hang on
      # macos"), a long-documented JDK/AppKit bug specifically affecting
      # sessions started without a real, matching logged-in GUI session
      # for the same user (SSH being the classic case the bug report
      # names, which is architecturally close to how a CI runner's own
      # job process gets started). The fix that actually shipped for it
      # is conditional on -Djava.awt.headless=false being explicitly
      # forced - without it, the JVM falls back to its own default
      # detection instead, which doesn't benefit from that fix. Added
      # here on that basis - genuinely uncertain whether GitHub's own
      # macOS runners hit the exact scenario this fix targets, so this
      # is a real attempt, not a confirmed one.
      - name: Smoke-test the build
        timeout-minutes: 3
        run: |
          APP="dist/solarchvision_bim_macos-aarch64.app"
          JAVA_DIR="$APP/Contents/Java"

          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"

          CLASSPATH="$(find "$JAVA_DIR" -maxdepth 1 -name '*.jar' | paste -sd ':' -)"
          echo "==> Classpath entry count: $(echo "$CLASSPATH" | tr ':' '\n' | wc -l)"

          java \
            -XstartOnFirstThread \
            -Djava.awt.headless=false \
            -Djava.library.path="$JAVA_DIR" \
            -cp "$CLASSPATH" \
            solarchvision_bim \
            USER=AUTO RUN=command/test/primitives.svs &
          APP_PID=$!

          sleep 20

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "==> Still running after 20s - process tree:"
            ps -ef | grep -i "java\|solarchvision_bim" | grep -v grep

            JAVA_PID="$(pgrep -f solarchvision_bim | head -1)"
            if [ -n "$JAVA_PID" ]; then
              echo "==> Sending SIGQUIT to $JAVA_PID for a thread dump:"
              kill -QUIT "$JAVA_PID"
              sleep 3
            fi

            echo "==> Killing $APP_PID"
            kill -9 "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null
            echo "error: timed out waiting for the app to exit - see the thread dump above" >&2
            exit 1
          fi

          wait "$APP_PID"
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "error: solarchvision_bim exited with code $EXIT_CODE" >&2
            exit 1
          fi

          SCREENSHOT="$(find projects -name 'primitives.png' -print -quit)"
          if [ -z "$SCREENSHOT" ]; then
            echo "error: primitives.png was not produced - the dist build may be broken" >&2
            exit 1
          fi
          echo "==> Found: $SCREENSHOT"
