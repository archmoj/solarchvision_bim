name: Overture 3D import (single location)

# Manual only - this reads from Overture's public S3 bucket for one
# location, so it should not run on every push/PR. Trigger it from the
# Actions tab (or the gh CLI/API) when you actually want a fresh export.
on:
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude (WGS84)'
        required: true
        default: '40.7484'
      lon:
        description: 'Longitude (WGS84)'
        required: true
        default: '-73.9857'
      radius:
        description: 'Radius in meters'
        required: true
        default: '250'
      outdir:
        description: 'Output folder name (holds buildings.obj + more_info.txt)'
        required: true
        default: 'empire_state_area_overture'
      include_parts:
        description: 'Also fetch building_part features (needed for complex buildings modeled as separate parts, e.g. towers with a coarse has_parts=true outline of their own)'
        required: false
        type: boolean
        default: false
      release:
        description: 'Overture release version to pin (leave blank for latest, auto-resolved via their STAC catalog)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: import/requirements-overture.txt

      # Matches import/README.md's "Setup & usage - Overture Maps" section.
      - name: Install dependencies
        run: pip install -r import/requirements-overture.txt

      - name: Run SOLARCHVISION_Overture_3D_in_obj.py
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.include_parts }}" = "true" ]; then
            EXTRA_ARGS="--include-parts"
          fi
          if [ -n "${{ inputs.release }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --release ${{ inputs.release }}"
          fi
          python import/SOLARCHVISION_Overture_3D_in_obj.py \
            --lat "${{ inputs.lat }}" \
            --lon "${{ inputs.lon }}" \
            --radius "${{ inputs.radius }}" \
            --outdir "${{ inputs.outdir }}" \
            $EXTRA_ARGS

      - name: Upload output folder
        # The script exits non-zero if buildings succeeded but
        # building_part fetch didn't (a best-effort layer when
        # include_parts is set) - still upload whatever was written
        # rather than silently dropping it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.outdir }}
          path: ${{ inputs.outdir }}
          if-no-files-found: error
          retention-days: 14
