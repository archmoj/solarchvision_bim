name: Overture 3D import (single location)

# Manual only - this reads from Overture's public S3 bucket for one
# location, so it should not run on every push/PR. Trigger it from the
# Actions tab (or the gh CLI/API) when you actually want a fresh export.
on:
  workflow_dispatch:
    inputs:
      lat:
        description: 'Latitude (WGS84)'
        required: true
        default: '40.7484'
      lon:
        description: 'Longitude (WGS84)'
        required: true
        default: '-73.9857'
      radius:
        description: 'Radius in meters'
        required: true
        default: '250'
      outdir:
        description: 'Output folder name (holds buildings.obj + buildings.svs + more_info.svs)'
        required: true
        default: 'empire_state_area_overture'
      include_parts:
        description: 'Also fetch building_part features (needed for complex buildings modeled as separate parts, e.g. towers with a coarse has_parts=true outline of their own)'
        required: false
        type: boolean
        default: false
      material:
        description: 'Material index (m:) for buildings.svs Mesh lines'
        required: false
        default: '7'
      tessellation:
        description: 'Tessellation index (tes:) for buildings.svs Mesh lines'
        required: false
        default: '0'
      layer:
        description: 'Layer index (lyr:) for buildings.svs Mesh lines'
        required: false
        default: '0'
      no_buildings_svs:
        description: 'Skip writing buildings.svs (the SOLARCHVISION_BIM Mesh-command form)'
        required: false
        type: boolean
        default: false
      release:
        description: 'Overture release version to pin (leave blank for latest, auto-resolved via their STAC catalog)'
        required: false
        default: ''
      no_stac:
        description: 'Skip the STAC-accelerated query and go straight to a direct dataset scan (slower, but immune to a known overturemaps bug where a STAC catalog gap causes a crash)'
        required: false
        type: boolean
        default: false
      trees_source:
        description: 'Where to get trees from for more_info.svs (Overture has no tree layer of its own)'
        required: false
        type: choice
        options:
          - none
          - osm
        default: none

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: import/requirements-overture.txt

      # Matches import/README.md's "Setup & usage - Overture Maps" section.
      - name: Install dependencies
        run: pip install -r import/requirements-overture.txt

      # Only needed for --trees-source osm; kept out of requirements-overture.txt
      # so the default (buildings-only) install stays lean, per import/README.md.
      - name: Install osmnx (for --trees-source osm)
        if: inputs.trees_source == 'osm'
        run: pip install osmnx

      - name: Run SOLARCHVISION_Overture_3D_in_obj.py
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.include_parts }}" = "true" ]; then
            EXTRA_ARGS="--include-parts"
          fi
          if [ -n "${{ inputs.release }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --release ${{ inputs.release }}"
          fi
          if [ "${{ inputs.no_stac }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-stac"
          fi
          if [ "${{ inputs.trees_source }}" = "osm" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --trees-source osm"
          fi
          if [ "${{ inputs.no_buildings_svs }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --no-buildings-svs"
          fi
          python import/SOLARCHVISION_Overture_3D_in_obj.py \
            --lat "${{ inputs.lat }}" \
            --lon "${{ inputs.lon }}" \
            --radius "${{ inputs.radius }}" \
            --outdir "${{ inputs.outdir }}" \
            --material "${{ inputs.material }}" \
            --tessellation "${{ inputs.tessellation }}" \
            --layer "${{ inputs.layer }}" \
            $EXTRA_ARGS

      - name: Upload output folder
        # The script exits non-zero if buildings succeeded but
        # building_part or tree fetch didn't (both best-effort when
        # include_parts / trees_source=osm are set) - still upload
        # whatever was written rather than silently dropping it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.outdir }}
          path: ${{ inputs.outdir }}
          if-no-files-found: error
          retention-days: 14
